[project]
name = "wander"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.10",
    "langgraph>=0.4",
    "langgraph-checkpoint-mongodb>=0.1",
    "openai>=1.60",
    "voyageai>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "email-validator>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
