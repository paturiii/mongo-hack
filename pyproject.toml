[project]
name = "wander"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pymongo>=4.13,<5",
    "langgraph>=1,<2",
    "langgraph-checkpoint-mongodb>=0.3,<1",
    "langchain-openai>=1,<2",
    "openai>=1.60",
    "voyageai>=0.3",
    "python-dotenv>=1.1,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "email-validator>=2.2",
    "dnspython>=2.6",
    "langchain-core>=1,<2",
    "langsmith>=0.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

# These boundaries intentionally catch all adapter/driver failures to preserve jobs
# and avoid logging credentials from provider exception strings.
[tool.ruff.lint.per-file-ignores]
"scripts/check_env.py" = ["BLE001"]
"scripts/check_services.py" = ["BLE001"]
"shared/config.py" = ["BLE001"]
"track1_disruption/alerts.py" = ["BLE001"]
"track1_disruption/api.py" = ["BLE001"]
"track1_disruption/digest.py" = ["BLE001"]
"track1_disruption/run.py" = ["BLE001"]
# Track 3 scripts: root-logger CLI output, immediately-called loop lambdas, test-local toy class state.
"scripts/seed_corpus.py" = ["LOG015"]
"scripts/repair_geocodes.py" = ["B023"]
"scripts/test_track3_acs.py" = ["RUF012"]
